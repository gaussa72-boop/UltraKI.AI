<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UltraKI App</title><style>body{margin:0;background:#070914;color:#eef;font:16px system-ui}main{max-width:900px;margin:auto;padding:32px}.card{background:#12172b;border:1px solid #30365b;border-radius:18px;padding:20px;margin:16px 0}button{background:#7657ff;color:#fff;border:0;border-radius:10px;padding:12px}input{padding:12px;width:70%;background:#090c18;color:#fff;border:1px solid #394060;border-radius:10px}#log{white-space:pre-wrap;min-height:110px}</style></head><body><main><h1>UltraKI.AI</h1><p>Eigenständige UltraKI-Web-App.</p><div class="card"><h2>KI-Chat</h2><div id="log">Session bereit.</div><p><input id="q" placeholder="Nachricht…"><button onclick="chat()">Senden</button></p></div><div class="card"><h2>Workspace</h2><p>Login · Chatverlauf · KI-Anbindung · Projektmodule</p></div></main><script>function chat(){let q=document.getElementById('q').value.trim();if(!q)return;document.getElementById('log').textContent='Du: '+q+'\n\nUltraKI: App läuft. Für Modellantworten wird der vorhandene sichere Backend/API-Weg verwendet.'}</script></body></html>
