<!doctype html><html lang="de"><meta charset="utf-8"><title>UltraKI Dashboard</title><body><h1>UltraKI</h1><p>Willkommen, {{ username }}.</p><div id="messages"></div><form id="chat"><input id="message" autocomplete="off" required><button>Senden</button></form><a href="/logout">Logout</a><script>document.querySelector('#chat').addEventListener('submit',async e=>{e.preventDefault();const input=document.querySelector('#message');const box=document.querySelector('#messages');const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:input.value})});const d=await r.json();box.textContent+=(box.textContent?'\n':'')+'KI: '+(d.reply||d.error);input.value='';});</script></body></html>
