<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KI Social</title><style>body{font:15px system-ui;background:#070916;color:#eef;margin:0}main{max-width:1000px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:240px 1fr;gap:16px}.c{background:#11162b;border:1px solid #30385e;border-radius:16px;padding:16px}.av{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#fff,#9cf,#725cff);font-weight:800}button{background:#1a2040;color:#fff;border:1px solid #3b4675;border-radius:9px;padding:8px;margin:3px;cursor:pointer}.on{background:#45339a}#m{height:420px;overflow:auto}.msg{padding:10px;margin:7px 0;background:#191f39;border-radius:10px}.me{margin-left:20%;background:#26315a}input{width:75%;box-sizing:border-box;background:#080b18;color:#fff;border:1px solid #39426d;border-radius:9px;padding:11px}.muted{color:#9ba4c7}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><main><h1>KI Social</h1><p class=muted>Profil · Nutzer-Chat · KI-Agenten · Themen-Bots</p><div class=grid><aside class=c><div class=av id=a>KI</div><h2 id=n>Dein Profil</h2><button onclick=profile()>Profil bearbeiten</button><h3>Agenten</h3><div id=ags></div></aside><section class=c><div id=t></div><div id=m></div><input id=i placeholder="Nachricht…" onkeydown="if(event.key==='Enter')send()"><button onclick=send()>Senden</button></section></div></main><script>const A={Allgemein:'Assistent','Quantenformel':'Quanten-Agent','KI & Technik':'Tech-Agent',Programmieren:'Coding-Agent',Gaming:'Game-Agent',Shop:'Shop-Agent',Notizen:'Notiz-Agent',Kreativ:'Creative-Agent'};let topic='Allgemein',p=JSON.parse(localStorage.getItem('kisocial')||'{"name":"Dein Profil"}');n.textContent=p.name;a.textContent=p.name.slice(0,2).toUpperCase();for(const x in A){let b=document.createElement('button');b.textContent=x;b.onclick=()=>{topic=x;document.querySelectorAll('#t button').forEach(z=>z.classList.remove('on'));b.classList.add('on');add('System',A[x]+' aktiv.')};t.append(b);ags.innerHTML+='<p><b>'+A[x]+'</b><br><span class=muted>'+x+'</span></p>'}t.firstChild.classList.add('on');function add(w,x){m.innerHTML+='<div class="msg '+(w==='Du'?'me':'')+'"><b>'+w+':</b> '+x.replace(/[<>]/g,'')+'</div>';m.scrollTop=99999}function send(){let x=i.value.trim();if(!x)return;add('Du',x);i.value='';setTimeout(()=>add(A[topic],topic==='Programmieren'?'Ich helfe bei Code, Tests und Debugging.':topic==='Quantenformel'?'Ich strukturiere Formel, Modell und Simulation.':'Ich habe deine Nachricht erhalten. Für echte KI-Antworten kann hier eine API angeschlossen werden.'),180)}function profile(){let x=prompt('Profilname',p.name);if(x){p.name=x;localStorage.setItem('kisocial',JSON.stringify(p));n.textContent=x;a.textContent=x.slice(0,2).toUpperCase()}}add('System','Thematische Agenten sind getrennt. Echtzeit-Nutzerchat benötigt Backend/Auth/DB.');</script>
